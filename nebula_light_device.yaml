---

# Refs.:
# - https://github.com/M4GNV5/esphome-SK20-Nebula-Light
# - https://github.com/fonix232/esphome_nebula_light
# - https://github.com/kireque/esphome_nebula_light/issues/8

substitutions:
  # Lasing threshold — measure per unit, override from the device file
  laser_min_power: "32%"

light:
  - platform: rgb
    name: "${device_name} Light"
    id: rgb_light
    restore_mode: ALWAYS_OFF
    red: red
    green: green
    blue: blue
    effects:
      - random:
          transition_length: 2.5s
          update_interval: 3s
      - random:
          name: Random Slow
          transition_length: 10s
          update_interval: 5s
      - flicker:
          alpha: 95%
          intensity: 2.5%
      - strobe:
      - pulse:
          transition_length: 30s
          update_interval: 30s
          min_brightness: 5%
          max_brightness: 100%
      - strobe:
          name: Galaxy Travel
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 100%
              blue: 100%
              duration: 12s
              transition_length: 12s
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 12s
              transition_length: 12s
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 12s
              transition_length: 12s
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 12s
              transition_length: 12s
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 12s
              transition_length: 12s
    on_turn_on:
      - script.execute: script_sync_state
    on_turn_off:
      - script.execute: script_sync_state

  - platform: monochromatic
    name: "${device_name} Laser"
    icon: mdi:laser-pointer
    id: laser
    output: laser_pwm
    # Slider travel spread across the usable range
    gamma_correct: 2.0
    restore_mode: ALWAYS_OFF
    effects:
      - flicker:
          name: "Twinkle"
          alpha: 98%
          intensity: 3%
      - flicker:
          name: "Twinkle Soft"
          alpha: 99%
          intensity: 2%
      - flicker:
          name: "Twinkle Restless"
          alpha: 95%
          intensity: 6%
      - pulse:
          name: "Breathing"
          transition_length: 15s
          update_interval: 15s
          min_brightness: 20%
          max_brightness: 45%
      - pulse:
          name: "Breathing Deep"
          transition_length: 25s
          update_interval: 25s
          min_brightness: 15%
          max_brightness: 80%
    on_turn_on:
      - script.execute: script_sync_state
    on_turn_off:
      - script.execute: script_sync_state

  # Button LED (UP/Down position, no brightness control)
  - platform: binary
    name: "${device_name} Button Status LED"
    id: button_led0
    output: button_led0_gpio
    restore_mode: ALWAYS_OFF
    internal: false

  - platform: monochromatic
    name: "${device_name} Button LED1"
    id: button_led1
    output: button_led1_pwm
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "${device_name} Rotation"
    icon: mdi:rotate-right
    id: motor
    output: motor_pwm
    # Speed must map linearly to PWM duty cycle
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: script_sync_state
    on_turn_off:
      - script.execute: script_sync_state

# The template switch representing the device is currently active: a light or
# the laser is projecting something. The motor alone does not count.
switch:
  - platform: template
    name: "${device_name} Main Switch"
    id: switch_main
    # Single definition of "active": the motor alone projects nothing
    lambda: "return (id(rgb_light).remote_values.is_on() || id(laser).remote_values.is_on());"

    # Restore the last active state, component by component
    turn_on_action:
      - if:
          condition:
            lambda: "return id(saved_rgb_on);"
          then:
            - light.turn_on: rgb_light
      - if:
          condition:
            lambda: "return id(saved_laser_on);"
          then:
            - light.turn_on: laser
      - if:
          condition:
            lambda: "return id(saved_motor_on);"
          then:
            - light.turn_on: motor
      - light.turn_on: button_led0

    # Motor and button LED are turned off by script_sync_state
    turn_off_action:
      - light.turn_off: laser
      - light.turn_off: rgb_light

output:
  - platform: libretiny_pwm
    id: red
    pin: P9
    inverted: true
    # Driver minimum pulse width, generous margin
    min_power: 1%
    zero_means_zero: true

  - platform: libretiny_pwm
    id: green
    pin: P24
    inverted: true
    # Driver minimum pulse width, generous margin
    min_power: 1%
    zero_means_zero: true

  - platform: libretiny_pwm
    id: blue
    pin: P26
    inverted: true
    # Driver minimum pulse width, generous margin
    min_power: 1%
    zero_means_zero: true

  - platform: libretiny_pwm
    id: laser_pwm
    pin: P8
    inverted: true
    # Lowest duty cycle with reproducible intensity (measured on this unit)
    min_power: ${laser_min_power}
    zero_means_zero: true

  - platform: libretiny_pwm
    id: motor_pwm
    pin: P6
    # Measured stall threshold is around 17.5%, plus margin for wear and temperature
    min_power: 19%
    zero_means_zero: true

  - platform: gpio
    id: button_led0_gpio
    pin: P1
    inverted: true

  - platform: libretiny_pwm
    id: button_led1_pwm
    pin: P7
    inverted: true

binary_sensor:
  - platform: gpio
    pin:
      number: P14
      mode: INPUT_PULLDOWN_16
      inverted: true
    name: "${device_name} Button"

    # Short press toggles the device, restoring the last active state
    on_click:
      min_length: 50ms
      max_length: 900ms
      then:
        - switch.toggle: switch_main

    # Long press cycles through the scenes, but only while something is on
    on_multi_click:
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                - switch.is_on: switch_main
              then:
                - select.next: select_scene
              else:
                - switch.turn_on: switch_main

globals:
  - id: saved_rgb_on
    type: bool
    restore_value: false
    initial_value: 'true'

  - id: saved_laser_on
    type: bool
    restore_value: false
    initial_value: 'true'

  - id: saved_motor_on
    type: bool
    restore_value: false
    initial_value: 'true'

script:
  # Single mechanism driving every side effect of the device going dark.
  #
  # While the device is active, keep a snapshot of which components are on. Once
  # it goes dark the snapshot stops updating, so it holds the last active state
  # and the main switch can restore it verbatim.
  #
  # The motor is deliberately absent from the main switch lambda, so turning it
  # off here cannot change the switch state and cannot re-enter this script.
  - id: script_sync_state
    mode: restart
    then:
      # Debounce: several components usually change within one action sequence
      - delay: 500ms
      - if:
          condition:
            - switch.is_on: switch_main
          then:
            - lambda: |-
                id(saved_rgb_on) = id(rgb_light).remote_values.is_on();
                id(saved_laser_on) = id(laser).remote_values.is_on();
                id(saved_motor_on) = id(motor).remote_values.is_on();
          else:
            # Nothing is being projected: the motor would only wear out
            - if:
                condition:
                  lambda: "return id(motor).remote_values.is_on();"
                then:
                  - light.turn_off: motor
            - light.turn_off: button_led0

select:
  platform: template
  name: "${device_name} Scene"
  id: select_scene
  options:
    - "Scene - Red & Blue"
    - "Scene - Night Light"
    - "Scene - White"
    - "Scene - Red"
    - "Scene - Blue"
    - "Scene - Green"
  initial_option: "Scene - Red & Blue"
  optimistic: true
  on_value:
    then:
      # Make sure the button LED is ON
      - light.turn_on:
          id: button_led0

      # [INDEX=0]: Scene - Red & Blue
      - if:
          condition:
            lambda: "return (id(select_scene).active_index() == 0);"
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 100%
                green: 0%
                blue: 100%
            - light.turn_on:
                id: laser
                brightness: 100%
            - light.turn_on:
                id: motor
                brightness: 10%

      # [INDEX=1]: Scene - Night Light
      - if:
          condition:
            lambda: "return (id(select_scene).active_index() == 1);"
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 25%
                red: 100%
                green: 0%
                blue: 100%
            - light.turn_on:
                id: laser
                brightness: 1%
            - light.turn_on:
                id: motor
                brightness: 5%

      # [INDEX=2]: Scene - White
      - if:
          condition:
            lambda: "return (id(select_scene).active_index() == 2);"
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
            - light.turn_on:
                id: laser
                brightness: 100%
            - light.turn_on:
                id: motor
                brightness: 50%

      # [INDEX=3]: Scene - Red
      - if:
          condition:
            lambda: "return (id(select_scene).active_index() == 3);"
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
            - light.turn_on:
                id: laser
                brightness: 100%
            - light.turn_on:
                id: motor
                brightness: 50%

      # [INDEX=4]: Scene - Blue
      - if:
          condition:
            lambda: "return (id(select_scene).active_index() == 4);"
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
            - light.turn_on:
                id: laser
                brightness: 100%
            - light.turn_on:
                id: motor
                brightness: 50%

      # [INDEX=5]: Scene - Green
      - if:
          condition:
            lambda: "return (id(select_scene).active_index() == 5);"
          then:
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 100%
                blue: 0%
            - light.turn_on:
                id: laser
                brightness: 100%
            - light.turn_on:
                id: motor
                brightness: 50%

